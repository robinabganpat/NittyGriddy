# Builds and tests every push and pull request.

name: Build

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Test
        run: dotnet test NittyGriddy.sln -c Release --nologo
